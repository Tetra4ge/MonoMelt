apiVersion: apps/v1
kind: Deployment
metadata:
  name: contexts-service
  labels:
    app: contexts-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contexts-service
  template:
    metadata:
      labels:
        app: contexts-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: contexts-service
        image: contexts-service:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
